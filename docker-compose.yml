version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowmatic-backend
    ports:
      - "10000:10000"
    environment:
      - NODE_ENV=production
      - PORT=10000
      - BASE_PATH=/api
      # Add your environment variables here or use .env file
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - flowmatic-network

networks:
  flowmatic-network:
    driver: bridge
